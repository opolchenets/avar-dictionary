{% extends "website/base.html" %}
{% load static %}
{% block title %}Dictionary – Avaro-English{% endblock %}
{% block content %}
<section class="page-shell dictionary-page">
  <div class="page-header">
    <div>
      <p class="section-kicker">Lexicon</p>
      <h1 class="page-title">Dictionary</h1>
      <p class="page-intro">Search Avar words, roots, and translations across the living archive.</p>
    </div>
    <div class="page-emblem" aria-hidden="true">⛰️</div>
  </div>
  <form id="searchForm" class="search-section">
    <input type="search" id="searchInput" class="search-input" placeholder="Search...">
    <button id="directionToggle" type="button" class="search-btn direction-btn">av→en</button>
    <button type="submit" class="search-btn">Search</button>
  </form>
  <div id="results"></div>
  <div id="wordDetails" class="word-details"></div>
</section>
{% endblock %}
{% block scripts %}
<script src="{% static 'website/js/dictionary.js' %}"></script>
{% endblock %}

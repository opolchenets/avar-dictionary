services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_USE_POSTGRES: "True"
      POSTGRES_HOST: db
      DJANGO_DEBUG: "False"
      AUDIO_REQUIRE_DECODER: "True"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./media:/app/media
      - ./transfer:/app/transfer
      - ./private_asr_trials:/app/private_asr_trials
    expose: ["8000"]
  caddy:
    profiles: [public]
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    depends_on: [web]
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
